name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Security
        shell: pwsh
        run: ./scripts/check.ps1
